{% extends 'base.html' %}{% block content %}<h1>Twój profil</h1><p class="subtitle">Dostosuj wygląd i zmień hasło.</p><section class="card"><h2>{{ g.user.name }}</h2><p>{{ g.user.position or roles[g.user.role] }}</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><label>Kolor portalu<select name="color">{% for color in colors %}<option value="{{ color }}" {{ 'selected' if color==g.user.color }}>{{ ['Zielony — Super dziennik','Fioletowy','Ciemnozielony','Różowy','Pomarańczowy'][loop.index0] }}</option>{% endfor %}</select></label><h2>Zmiana hasła</h2><p>Pozostaw pola puste, aby zmienić tylko kolor.</p><label>Obecne hasło<input type="password" name="current_password" autocomplete="current-password"></label><label>Nowe hasło<input type="password" name="password" minlength="10" autocomplete="new-password"></label><button>Zapisz zmiany</button></form></section>{% endblock %}
